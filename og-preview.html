<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OG Image Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a2611;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 2rem;
      padding: 2rem;
      font-family: 'DM Sans', sans-serif;
    }

    .label {
      color: rgba(255,255,255,0.3);
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .og-card {
      width: 1200px;
      height: 630px;
      transform-origin: top center;
      transform: scale(0.6);
      margin-bottom: -252px;
      background: #1f2d15;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .og-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 50%, rgba(40,70,25,0.18) 0%, transparent 65%),
        radial-gradient(ellipse 120% 80% at 20% 110%, rgba(20,55,15,0.55) 0%, transparent 55%),
        radial-gradient(ellipse 120% 80% at 80% -10%, rgba(10,35,8,0.6) 0%, transparent 55%);
      z-index: 0;
    }

    .og-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1;
      opacity: 0.18;
    }

    .og-inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .og-rule-top {
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, transparent, rgba(92,122,46,0.7));
      margin-bottom: 2.5rem;
    }

    .og-mono {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 2rem;
      position: relative;
    }

    .og-mono-bg {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 0;
      pointer-events: none;
    }

    .og-mono-bg-leaf { left: -18px; }
    .og-mono-bg-tech { right: -18px; }

    .og-bp, .og-arrow, .og-b {
      position: relative;
      z-index: 1;
    }

    .og-bp {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4.5rem;
      font-weight: 300;
      color: #5c7a2e;
      letter-spacing: 0.08em;
      line-height: 1;
      text-shadow: 0 0 32px rgba(92,122,46,0.35);
    }

    .og-arrow {
      display: flex;
      align-items: center;
      padding: 0 0.6rem;
    }

    .og-b {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4.5rem;
      font-weight: 300;
      color: #3a8a82;
      letter-spacing: 0.08em;
      line-height: 1;
      text-shadow: 0 0 32px rgba(58,138,130,0.35);
    }

    .og-wordmark {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(200,228,170,0.75);
      margin-bottom: 2.8rem;
    }

    .og-tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.35rem;
      font-weight: 300;
      color: rgba(220,238,200,0.88);
      letter-spacing: 0.04em;
    }

    .og-rule-bottom {
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, rgba(92,122,46,0.7), transparent);
      margin-top: 2.5rem;
    }

    .og-corner {
      position: absolute;
      width: 20px;
      height: 20px;
      z-index: 2;
      opacity: 0.6;
    }
    .og-corner-tl { top: 40px; left: 40px; border-top: 1px solid #5c7a2e; border-left: 1px solid #5c7a2e; }
    .og-corner-tr { top: 40px; right: 40px; border-top: 1px solid #5c7a2e; border-right: 1px solid #5c7a2e; }
    .og-corner-bl { bottom: 40px; left: 40px; border-bottom: 1px solid #5c7a2e; border-left: 1px solid #5c7a2e; }
    .og-corner-br { bottom: 40px; right: 40px; border-bottom: 1px solid #5c7a2e; border-right: 1px solid #5c7a2e; }

    .og-url {
      position: absolute;
      bottom: 44px;
      left: 0; right: 0;
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(92,122,46,0.65);
      z-index: 2;
    }
  </style>
</head>
